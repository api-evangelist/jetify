aid: jetify
name: Jetify
description: >-
  Jetify builds developer tooling for reproducible environments and package management, backed by
  the Nix ecosystem. Its open-source Devbox CLI creates instant, isolated, predictable development
  shells; Jetify Cloud adds team secrets management, a private Nix package cache, and deployments;
  Nixhub indexes over one million package versions across 100,000+ Nix packages and exposes a free,
  public REST API for searching and resolving them; and Testpilot is an AI agent for autonomous
  end-to-end testing. Jetify is backed by GV and Homebrew. This profile was enriched by the API
  Evangelist pipeline from Jetify's public docs, npm/Go registries, and live API probes.
